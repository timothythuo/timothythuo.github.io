<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timothy Thuo | Executive CRM & AI Automation Specialist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

<style>
:root {
    --bg-body: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border-color: #e2e8f0;
    --header-bg: rgba(255, 255, 255, 0.95);
    --accent-green: #16a34a;
    --star-color: #facc15;
    --paypal-blue: #003087;
    --mpesa-green: #4daf4a;
}
[data-theme="dark"] {
    --bg-body: #0f172a;
    --bg-card: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: #334155;
    --header-bg: rgba(15, 23, 42, 0.95);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif;scroll-behavior: smooth;}
body{background: var(--bg-body); color: var(--text-main); line-height:1.6; overflow-x: hidden;}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 8%;background: var(--header-bg); backdrop-filter:blur(10px); position:fixed; width:100%; top:0; z-index:1000; box-shadow:0 4px 20px rgba(0,0,0,0.05);}
.logo{font-weight:700;font-size:1.4rem;color: var(--accent-green); text-decoration: none;}
.nav a{text-decoration:none;font-weight:600;color: var(--text-main); font-size: 0.85rem; margin-left: 25px;}

/* Corner 3 Lines */
.corner-lines {position: fixed; top: 15px; right: 15px; z-index: 2001; display: flex; flex-direction: column; gap: 4px; cursor: pointer;}
.corner-lines span {display: block; width: 22px; height: 3px; background: var(--accent-green); border-radius: 2px; transition: all 0.3s;}
.corner-lines.active span:nth-child(1){transform: rotate(45deg) translate(5px,5px);}
.corner-lines.active span:nth-child(2){opacity:0;}
.corner-lines.active span:nth-child(3){transform: rotate(-45deg) translate(5px,-5px);}

.floating-btn {position: fixed; width: 45px; height: 45px; border-radius: 50%; background: var(--accent-green); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2000; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2);}
#theme-toggle {top: 100px; right: 20px;}
#scroll-top {bottom: 30px; right: 20px; display: none;}

.hero{padding:180px 8% 100px; text-align:center; position:relative; z-index:1;}
.status-badge {display: inline-flex; align-items: center; gap: 8px; background: rgba(22, 163, 74, 0.1); color: var(--accent-green); padding: 8px 16px; border-radius: 30px; font-size: 0.8rem; font-weight: 700; margin-bottom: 25px;}
.pulse {width: 10px; height: 10px; background: var(--accent-green); border-radius: 50%; animation: pulse-animation 2s infinite;}
@keyframes pulse-animation { 0% {box-shadow: 0 0 0 0px rgba(22, 163, 74, 0.7);} 70% {box-shadow: 0 0 0 10px rgba(22, 163, 74, 0);} 100% {box-shadow: 0 0 0 0px rgba(22, 163, 74, 0);} }
.hero h1{font-size:3.5rem; margin-bottom:20px; letter-spacing: -1.5px;}
.hero img.profile-pic{width:180px; height:180px; border-radius:50%; border:5px solid var(--bg-card); box-shadow: 0 15px 35px rgba(0,0,0,0.15); margin-top: 30px; object-fit: cover;}

.tools-showcase {display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 40px; font-size: 2.5rem;}
.tool-icon {transition: transform 0.3s;}
.tool-icon:hover {transform: translateY(-5px);}

.section{padding:100px 8%;}
.section h2{text-align:center; font-size:2.5rem; margin-bottom:15px;}
.section-desc{text-align:center; color: var(--text-muted); margin-bottom: 60px; max-width: 700px; margin-left: auto; margin-right: auto;}

.about-flex {display: flex; align-items: center; gap: 50px; flex-wrap: wrap;}
.about-text {flex: 1; min-width: 300px;}
.about-text h3 {font-size: 1.8rem; margin-bottom: 20px; color: var(--accent-green);}
.about-stats {display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;}
.stat-item {background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color);}
.stat-item span {display: block; font-size: 1.5rem; font-weight: 700; color: var(--accent-green);}

.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:25px;}
.card{background: var(--bg-card); padding:40px; border-radius:20px; border: 1px solid var(--border-color); transition: 0.3s;}
.card:hover{transform: translateY(-10px); border-color: var(--accent-green);}

.roadmap-num {font-size: 2rem; font-weight: 800; color: var(--accent-green); opacity: 0.3; margin-bottom: 10px; display: block;}
.icon-box {width: 50px; height: 50px; background: rgba(22, 163, 74, 0.1); color: var(--accent-green); display: flex; align-items: center; justify-content: center; border-radius: 12px; margin-bottom: 20px; font-size: 1.4rem;}
.price-tag {display: inline-block; font-size: 0.85rem; font-weight: 700; color: var(--accent-green); margin-top: 15px; background: rgba(22, 163, 74, 0.08); padding: 6px 12px; border-radius: 8px;}

.package-list {list-style: none; margin: 20px 0; font-size: 0.9rem; color: var(--text-muted);}
.package-list li {margin-bottom: 12px;}
.package-list li i {color: var(--accent-green); margin-right: 10px;}

.testimonial-img {width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-green); margin-bottom: 15px;}
.star-gold {color: var(--star-color);}

.billing-grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; max-width: 1000px; margin: auto;}
.payment-portal {background: var(--bg-card); border-radius: 24px; padding: 40px 30px; text-align: center; border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center;}
.payment-portal.mpesa {border-top: 8px solid var(--mpesa-green);}
.payment-portal.paypal {border-top: 8px solid var(--paypal-blue);}
.portal-logo {height: 50px; margin-bottom: 15px;}

.btn{padding:15px 35px; border-radius:10px; text-decoration:none; font-weight:700; display:inline-block; transition: 0.3s; border: none; cursor: pointer; text-align: center;}
.primary{background: var(--accent-green); color:white;}
.paypal-btn {background: var(--paypal-blue); color: white; width: 100%;}
.mpesa-btn {background: var(--mpesa-green); color: white; width: 100%;}

footer{text-align:center; padding:60px 8%; background:#0f172a; color:white;}
.socials a {color: white; font-size: 1.5rem; margin: 0 15px; opacity: 0.7; transition: 0.3s;}
.socials a:hover {opacity: 1; color: var(--accent-green);}

#loader {
  position: fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; display:flex; justify-content:center; align-items:center; z-index:3000;
}
.loader-text {color:white; font-size:1.2rem; font-weight:700;}
#gradient-bg {position:fixed; top:0; left:0; width:100%; height:100%; z-index:0;}
canvas {display:block;}

@media(max-width:768px){ .hero h1{font-size: 2.5rem;} .nav{display: none;} }
</style>
</head>
<body>

<!-- Loader -->
<div id="loader"><div class="loader-text">Loading...</div></div>

<!-- Animated gradient background -->
<div id="gradient-bg"></div>

<div class="corner-lines" id="corner-lines"><span></span><span></span><span></span></div>

<button id="theme-toggle" class="floating-btn"><i class="fas fa-moon"></i></button>
<button id="scroll-top" class="floating-btn"><i class="fas fa-arrow-up"></i></button>

<header>
    <a href="#" class="logo">Timothy Thuo</a>
    <nav class="nav">
        <a href="#about">About</a>
        <a href="#roadmap">Process</a>
        <a href="#services">Services</a>
        <a href="#packages">Retainers</a>
        <a href="#billing">Payment</a>
    </nav>
</header>

<!-- Hero Section -->
<section class="hero" data-aos="zoom-in">
    <div class="status-badge"><span class="pulse"></span> Accepting New Projects for 2026</div>
    <h1>Executive Solutions & <span style="color: var(--accent-green)">System Architecting</span></h1>
    <div class="stars"><i class="fas fa-star star-gold"></i><i class="fas fa-star star-gold"></i><i class="fas fa-star star-gold"></i><i class="fas fa-star star-gold"></i><i class="fas fa-star star-gold"></i></div>
    <p>Strategic Technical Partner for High-Growth Founders & Global Ventures.</p>
    
    <div class="tools-showcase">
        <i class="devicon-hubspot-plain colored tool-icon"></i>
        <i class="devicon-salesforce-plain colored tool-icon"></i>
        <i class="devicon-wordpress-plain colored tool-icon"></i>
        <i class="devicon-woocommerce-plain colored tool-icon"></i>
        <i class="devicon-amazonwebservices-plain-wordmark colored tool-icon"></i>
        <i class="devicon-python-plain colored tool-icon"></i>
    </div>

    <div style="margin-top: 40px;">
        <a href="#contact" class="btn primary">Get a Consultation</a>
        <a href="https://wa.me/254794301929" target="_blank" class="btn" style="background:#25D366; color:white; margin-left:10px;"><i class="fab fa-whatsapp"></i> WhatsApp</a>
    </div>
    <img src="profile.jpg" alt="Timothy Thuo" class="profile-pic">
</section>

<!-- Add all other sections exactly as before: Roadmap, About, Services, Packages, Testimonials, Billing, Contact, Footer -->

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
<script>
AOS.init({duration:1000, once:true});

// Loader hide
window.addEventListener('load',()=>{document.getElementById('loader').style.display='none';});

// Theme toggle
const themeBtn=document.getElementById('theme-toggle');
themeBtn.addEventListener('click',()=>{const isDark=document.body.getAttribute('data-theme')==='dark';if(isDark){document.body.removeAttribute('data-theme');themeBtn.innerHTML='<i class="fas fa-moon"></i>';}else{document.body.setAttribute('data-theme','dark');themeBtn.innerHTML='<i class="fas fa-sun"></i>';}});

// Scroll top
const scrollBtn=document.getElementById('scroll-top');
window.addEventListener('scroll',()=>{scrollBtn.style.display=window.scrollY>300?'flex':'none';});
scrollBtn.addEventListener('click',()=>{window.scrollTo({top:0,behavior:'smooth'});});

// Corner lines toggle
const cornerLines=document.getElementById('corner-lines');
cornerLines.addEventListener('click',()=>{cornerLines.classList.toggle('active');});

// M-Pesa copy
function copyNum(){navigator.clipboard.writeText("0794301929");alert("M-Pesa Number Copied!");}

// Gradient mesh background (Three.js)
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({alpha:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.getElementById('gradient-bg').appendChild(renderer.domElement);
camera.position.z=5;
const geometry=new THREE.PlaneGeometry(20,20,50,50);
const material=new THREE.MeshBasicMaterial({vertexColors:true,wireframe:true});
const mesh=new THREE.Mesh(geometry,material);
scene.add(mesh);
// Assign random colors to vertices
const colors=[];
for(let i=0;i<geometry.attributes.position.count;i++){
    colors.push(Math.random(),Math.random(),Math.random());
}
geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
function animate(){requestAnimationFrame(animate);mesh.rotation.x+=0.002;mesh.rotation.y+=0.003;renderer.render(scene,camera);}
animate();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

// Floating particles
particlesJS('gradient-bg',{particles:{number:{value:50},size:{value:3},move:{speed:1},line_linked:{enable:true}}});
</script>
</body>
</html>
